<body>
  <!-- Header -->
  <header>
    <div class="logo">Study Planner</div>
    <nav>
      <div class="hamburger">
        <span></span>

        <li><a href="progress.html">Progress</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="task-manager">
      <h1>Task Manager</h1>
      <form id="taskForm">
        <label for="taskTitle">Task Title:</label>
        <input type="text" id="taskTitle" name="taskTitle" placeholder="Task title" required>
      
        <label for="taskDeadline">Deadline:</label>
        <input type="date" id="taskDeadline" name="taskDeadline" required>
      
        <label for="taskCategory">Category:</label>
        <select id="taskCategory" name="taskCategory">
          <option value="reading">Reading</option>
          <option value="assignment">Assignment</option>
          <option value="exam-prep">Exam Prep</option>
        </select>
      
        <button type="submit">Add Task</button>
      </form>
      

      <div id="taskList">
        <!-- Tasks will be rendered here -->
      </div>
    </section>
  </main>
  <footer>
